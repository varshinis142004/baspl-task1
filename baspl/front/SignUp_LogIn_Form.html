<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login/Signup Form</title>
  <link rel="stylesheet" href="SignUp_LogIn_Form.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <div class="form-box login">
      <form id="loginForm" action="javascript:void(0);">
        <h1>Login</h1>

        <div class="input-box">
          <input id="loginUsername" type="text" placeholder="Username" required>
          <i class='bx bxs-user'></i>
        </div>

        <div class="input-box">
          <input id="loginPassword" type="password" placeholder="Password" required>
          <i class='bx bxs-lock-alt' ></i>
        </div>

        <div id="loginError" style="color:#b91c1c; margin-bottom:10px; display:none;"></div>

        <div class="forgot-link">
          <a href="#">Forgot Password?</a>
        </div>

        <button id="loginBtn" type="submit" class="btn">Login</button>

        <p>or login with social platforms</p>
        <div class="social-icons">
          <a href="#"><i class='bx bxl-google' ></i></a>
        </div>
      </form>
    </div>

    <div class="form-box register">
      <form id="signupForm" action="javascript:void(0);">
        <h1>Sign Up</h1>

        <div class="input-box">
          <input id="signupUsername" type="text" placeholder="Username" required>
          <i class='bx bxs-user'></i>
        </div>

        <div class="input-box">
          <input id="signupEmail" type="email" placeholder="Email" required>
          <i class='bx bxs-envelope' ></i>
        </div>

        <div class="input-box">
          <input id="signupPassword" type="password" placeholder="Password" required>
          <i class='bx bxs-lock-alt' ></i>
        </div>

        <div id="signupError" style="color:#b91c1c; margin-bottom:10px; display:none;"></div>
        <div id="signupSuccess" style="color:#0b6623; margin-bottom:10px; display:none;"></div>

        <button id="signupBtn" type="submit" class="btn">Register</button>

        <p>or register with social platforms</p>
        <div class="social-icons">
          <a href="#"><i class='bx bxl-google' ></i></a>
          <a href="#"><i class='bx bxl-facebook' ></i></a>
          <a href="#"><i class='bx bxl-github' ></i></a>
          <a href="#"><i class='bx bxl-linkedin' ></i></a>
        </div>
      </form>
    </div>

    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an account?</p>
        <button class="btn register-btn">Register</button>
      </div>

      <div class="toggle-panel toggle-right">
        <h1>Welcome Back!</h1>
        <p>Already have an account?</p>
        <button class="btn login-btn">Login</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
